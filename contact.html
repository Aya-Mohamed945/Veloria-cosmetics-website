<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Veloria Cosmetics</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- header at first of each page to make the user easely browse -->
    <header>
        <div class="logo">
            <img src="https://i.postimg.cc/yN37y1zr/Screenshot-2025-11-29-055936.png" />
            <h1>VELORIA</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="http://localhost/VELORIA%20website/index.html#about">About</a><!--  .. is to go back to the index -->
            <a href="http://localhost/VELORIA%20website/index.html#catalog">Catalog</a><!--  .. is to go back to the index -->
            <a href="cart.html">Cart</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="nav-btns">
            <div class="log-in-button">
                <a id="goLogin" class="log-in" href="login.html">Log In</a>
            </div>
            <div class="sign-in-button">
                <a id="goRegister" class="sign-in" href="register.html">Sign In</a>
            </div>
        </div>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <!--contact form-->
            <div class="form-card">
                <h2>Contact Us</h2>

                <form id="contactForm" onsubmit="return sendMessage()">
                    <label>Your Name</label>
                    <input id="contactName" type="text" required />

                    <label>Email</label>
                    <input id="contactEmail" type="email" required />

                    <label>Message</label>
                    <textarea id="contactMessage" rows="5" required></textarea>

                    <button class="submit-btn">Send Message</button>
                </form>
            </div>

            <!--brand contact details-->
            <div class="contact-details">
                <h2>Contact Us</h2>
                <p><strong>Email:</strong> support@veloria.com</p>
                <p><strong>Phone:</strong> +20 123 456 789</p>
                <p><strong>Address:</strong> 123 Beauty Street, Cairo, Egypt</p>
                <div class="social-links">
                    <a href="https://www.facebook.com/veloria" target="_blank">Facebook</a>
                    <a href="https://www.instagram.com/veloria" target="_blank">Instagram</a>
                    <a href="https://www.twitter.com/veloria" target="_blank">Twitter</a>
                </div>
            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
